name: Camera Preview WebGL Browser Acceptance
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera-webgl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Select Main Camera and validate live GL preview
        run: node scripts/test-camera-live-preview-browser.mjs
      - name: Upload preview screenshot and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camera-live-preview
          path: .validation-tools/camera-live-preview/
          if-no-files-found: warn
