name: WarLike engine checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: find js -name '*.js' -print0 | xargs -0 -n1 node --check
      - run: npm test
      - run: npm run typecheck

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build csharp/WarLike.Runtime/WarLike.Runtime.csproj --configuration Release
      - run: dotnet build csharp/WarLike.Bridge/WarLike.Bridge.csproj --configuration Release
      - run: dotnet build csharp/WarLike.Demo/WarLike.Demo.csproj --configuration Release
      - run: dotnet run --project csharp/WarLike.Demo/WarLike.Demo.csproj --configuration Release --no-build
