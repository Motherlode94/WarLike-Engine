name: Engine integrity and Web export
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-acceptance:
    # Ubuntu 22.04 avoids the 24.04 AppArmor user-namespace restrictions.
    # Keep Bubblewrap's network, user and PID namespaces mandatory.
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm install --no-package-lock
      - name: Install native OS isolation tools
        run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - name: Verify native isolation before runtime acceptance
        run: |
          bwrap --unshare-all --unshare-user --disable-userns --new-session --die-with-parent --cap-drop ALL --ro-bind /usr /usr --ro-bind /bin /bin --ro-bind /lib /lib --ro-bind /lib64 /lib64 --proc /proc --dev /dev -- /bin/true
      - run: dotnet build csharp/WarLike.Bridge --configuration Release
      - run: npx playwright install --with-deps chromium
      - name: Real debugger, shared C# Play and isolated exports in Chromium
        run: node scripts/test-runtime-acceptance-browser.mjs
      - name: Upload runtime acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-acceptance
          path: .validation-tools/runtime-acceptance/
          if-no-files-found: ignore
  complex-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Complex scene edit, persistence, profiler and standalone export
        run: node scripts/test-complex-production-browser.mjs
      - name: Upload complex scene and profiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complex-production
          path: |
            .validation-tools/complex-production/*.json
            .validation-tools/complex-production/*.png
          if-no-files-found: ignore
  core-and-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - name: Rebuild portable runtime file manifest
        run: npm run build:runtime
      - name: Reject an outdated committed runtime manifest
        run: git diff --exit-code -- runtime-files.json js/core/player-modules.js
      - name: Verify portable Web module dependency closure
        run: node scripts/check-runtime-module-closure.mjs
      - name: Check runtime files required by native CHAMBRE 07
        run: node scripts/check-chambre07-runtime-manifest.mjs
      - name: Check TypeScript definitions
        run: npm run typecheck
      - name: Engine tests including legacy compatibility
        run: npm test
      - name: Full portable export smoke test
        run: npm run test:export
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Hostile JavaScript isolation and trust in Chromium
        run: node scripts/test-script-security-browser.mjs
      - name: Portable export with isolated JavaScript in Chromium
        run: npm run test:export:browser
        env:
          WARLIKE_EXPORT_BROWSER_OUTPUT_DIR: .validation-tools/export-browser
      - name: Reference editor, Blueprint and old/new project round trips
        run: node scripts/test-reference-editor-browser.mjs
      - name: Multi-object preview, persistence and Play in old/new 2D and 3D projects
        run: node scripts/test-authoring-integrity-browser.mjs
      - name: Unity-like dock layout and Hub visual regression in Chromium
        run: node scripts/test-unity-workspace-browser.mjs
      - name: CHAMBRE 07 export and isolated Play
        run: npm run test:chambre07:browser
        env:
          WARLIKE_CHAMBRE07_OUTPUT_DIR: .validation-tools/chambre07
      - name: CHAMBRE 07 export physics — Rapier in Chromium
        run: npm run test:chambre07:browser
        env:
          WARLIKE_PHYSICS_BACKEND: rapier
          WARLIKE_CHAMBRE07_OUTPUT_DIR: .validation-tools/chambre07-rapier
      - name: Upload export screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chambre07-export-play-screenshot
          path: |
            .validation-tools/export-browser/*.png
            .validation-tools/script-security/*.png
            .validation-tools/script-security/report.json
            .validation-tools/reference-editor/*.png
            .validation-tools/authoring-integrity/*.png
            .validation-tools/authoring-integrity/report.json
            .validation-tools/unity-workspace/*.png
            .validation-tools/chambre07/chambre07-play.png
            .validation-tools/chambre07/chambre07-ending-*.png
            .validation-tools/chambre07/legacy-2d-outcome.png
            .validation-tools/chambre07-rapier/chambre07-play.png
            .validation-tools/chambre07-rapier/chambre07-ending-*.png
            .validation-tools/chambre07-rapier/legacy-2d-outcome.png
          if-no-files-found: ignore

  p6-fps-tps-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Native P5 FPS/TPS portable export in Chromium
        run: node scripts/test-p6-fps-tps-export-browser.mjs
        env:
          WARLIKE_P6_OUTPUT_DIR: .validation-tools/p6-fps-tps
      - name: Upload P6 FPS/TPS screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p6-fps-tps-browser
          path: |
            .validation-tools/p6-fps-tps/*.png
            .validation-tools/p6-fps-tps/report.json
          if-no-files-found: ignore

  p7-editor-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Editor demo menu, Inspector, Play/Stop and project save/reopen FPS and TPS
        run: node scripts/test-p7-editor-demo-browser.mjs
      - name: Upload P7 editor screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-editor-lifecycle
          path: |
            .validation-tools/p7-editor/*.png
            .validation-tools/p7-editor/report.json
          if-no-files-found: ignore

  complete-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - name: Production GGX shader pixel checks
        run: node scripts/test-3d-pbr-browser.mjs
      - name: Complete keyboard route and GLB material rendering
        run: node scripts/test-complete-3d-browser.mjs
      - name: Upload complete 3D route and material evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: complete-3d-route-and-materials
          path: |
            .validation-tools/complete-3d/*.png
            .validation-tools/complete-3d/report.json
            .validation-tools/3d-pbr/report.json
          if-no-files-found: ignore
