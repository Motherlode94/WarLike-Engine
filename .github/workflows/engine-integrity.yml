name: Engine integrity and Web export
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock
      - name: Rebuild portable runtime file manifest
        run: npm run build:runtime
      - name: Check runtime files required by native CHAMBRE 07
        run: node scripts/check-chambre07-runtime-manifest.mjs
      - name: Check TypeScript definitions
        run: npm run typecheck
      - name: Engine tests including legacy compatibility
        run: npm test
      - name: Full portable export smoke test
        run: npm run test:export
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: CHAMBRE 07 export and isolated Play
        run: npm run test:chambre07:browser
        env:
          WARLIKE_CHAMBRE07_OUTPUT_DIR: .validation-tools/chambre07
      - name: CHAMBRE 07 export physics — Rapier in Chromium
        run: npm run test:chambre07:browser
        env:
          WARLIKE_PHYSICS_BACKEND: rapier
          WARLIKE_CHAMBRE07_OUTPUT_DIR: .validation-tools/chambre07-rapier
      - name: Upload export screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chambre07-export-play-screenshot
          path: |
            .validation-tools/chambre07/chambre07-play.png
            .validation-tools/chambre07-rapier/chambre07-play.png
          if-no-files-found: ignore
