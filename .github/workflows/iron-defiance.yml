name: Iron Defiance mission and offline export
on:
  push:
    paths:
      - 'examples/iron-defiance/**'
      - '.github/workflows/iron-defiance.yml'
  pull_request:
    paths:
      - 'examples/iron-defiance/**'
      - '.github/workflows/iron-defiance.yml'
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate rules
        run: node --test examples/iron-defiance/tests/*.test.mjs
      - name: Install dependencies for isolated game
        working-directory: examples/iron-defiance
        run: npm install --no-package-lock --ignore-scripts
      - name: Generate portable Web bundle
        working-directory: examples/iron-defiance
        run: npm run build
      - name: Check portable bundle exists and contains Three.js
        run: |
          test -s examples/iron-defiance/dist/game.js
          test -s examples/iron-defiance/dist/index.html
          ! grep -q 'cdn.jsdelivr.net' examples/iron-defiance/dist/index.html
          grep -q 'MISSION ACTIVE' examples/iron-defiance/dist/index.html
      - name: Install browser testing tools
        run: |
          npm install --no-package-lock --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Play the exported mission in Chromium
        run: node scripts/test-iron-defiance-browser.mjs
      - name: Upload mission screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iron-defiance-browser-evidence
          path: outputs/iron-defiance/
          if-no-files-found: ignore
      - name: Upload Web build for browser testing
        uses: actions/upload-artifact@v4
        with:
          name: iron-defiance-cendre01-web
          path: examples/iron-defiance/dist/
          retention-days: 7
