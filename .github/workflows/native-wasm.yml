name: Build the C++ WebAssembly runtime
on:
  push:
    branches: [main]
    paths:
      - 'native/*.cpp'
      - 'native/build-wasm.sh'
      - 'native/tests/**'
      - 'js/core/native-3d.js'
      - 'tests/native-3d-wasm.test.mjs'
      - 'scripts/bench-native-queries.mjs'
      - '.github/workflows/native-wasm.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-wasm-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the official Emscripten SDK
        run: |
          git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/warlike-emsdk"
          "$RUNNER_TEMP/warlike-emsdk/emsdk" install 3.1.74
          "$RUNNER_TEMP/warlike-emsdk/emsdk" activate 3.1.74
      - name: Compile and check the native systems
        run: |
          source "$RUNNER_TEMP/warlike-emsdk/emsdk_env.sh"
          sh native/tests/run-smoke.sh
          sh native/build-wasm.sh
          node --check native/dist/warlike_pathfinding.mjs
      - name: Test the compiled WebAssembly in actual gameplay queries
        env:
          WARLIKE_REQUIRE_NATIVE_QUERIES: '1'
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run typecheck
          node scripts/bench-native-queries.mjs
      - name: Publish the compiled runtime on main
        run: |
          git config user.name 'WarLike build'
          git config user.email 'warlike-build@users.noreply.github.com'
          git add native/dist
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Bundle the compiled C++ navigation and physics WASM runtime'
          git fetch origin main
          git rebase origin/main
          node scripts/build-runtime-manifest.mjs
          git add runtime-files.json
          git commit --amend --no-edit
          git push origin HEAD:main
