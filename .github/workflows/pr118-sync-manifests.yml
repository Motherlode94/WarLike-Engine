name: Sync PR118 runtime manifests
on:
  push:
    branches:
      - feat/clean-start-scene-camera-terrain-light-20261120
    paths-ignore:
      - runtime-files.json
      - js/core/player-modules.js
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'Motherlode94/WarLike-Engine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:runtime
      - name: Commit regenerated manifests only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- runtime-files.json js/core/player-modules.js
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): regenerate manifest for clean starter scene"
            git push origin HEAD:feat/clean-start-scene-camera-terrain-light-20261120
          fi
