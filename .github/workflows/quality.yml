name: Engine quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run typecheck
      - name: Refresh runtime file manifest
        run: node scripts/build-runtime-manifest.mjs
      - run: npm test
      - name: Verify local Python and C++ Script Studio runner
        run: python3 -m unittest discover -s tests -p 'script_runner_test.py' -v
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project csharp/WarLike.Tests
      - run: dotnet build csharp/WarLike.Bridge
