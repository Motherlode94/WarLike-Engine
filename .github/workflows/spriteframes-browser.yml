name: SpriteFrames Canvas2D Browser
on:
  pull_request:
  push:
    branches: [main]
jobs:
  spriteframes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-spriteframes-browser.mjs
