name: Sync P0 Animator Controller Runtime
on:
  push:
    branches: [feat/p0-animator-controller-assets-20261120]
    paths-ignore:
      - runtime-files.json
      - js/core/player-modules.js
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:runtime
      - name: Commit portable manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- runtime-files.json js/core/player-modules.js
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): include project-local Animator Controller assets"
            git push origin HEAD:feat/p0-animator-controller-assets-20261120
          fi
