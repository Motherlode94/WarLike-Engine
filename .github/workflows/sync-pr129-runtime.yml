name: Sync PR129 Runtime Manifests
on:
  push:
    branches: [feat/component-unity-tree-look-rotation-20261120]
    paths-ignore:
      - runtime-files.json
      - js/core/player-modules.js
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:runtime
      - name: Commit portable runtime manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- runtime-files.json js/core/player-modules.js
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): include component folders and player look rotation"
            git push origin HEAD:feat/component-unity-tree-look-rotation-20261120
          fi
