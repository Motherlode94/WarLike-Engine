name: Sync PR130 Clean Runtime Manifest
on:
  push:
    branches:
      - style/warlike-clean-rebased-main-20261120
    paths-ignore:
      - runtime-files.json
      - js/core/player-modules.js
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build:runtime
      - name: Commit generated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- runtime-files.json js/core/player-modules.js
          if ! git diff --cached --quiet; then
            git commit -m "build(runtime): include unified WarLike Clean CSS in Web export"
            git push origin HEAD:style/warlike-clean-rebased-main-20261120
          fi
