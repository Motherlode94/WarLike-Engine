<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike Engine — 2D Editor</title><style>
:root{color-scheme:dark;font:14px system-ui;background:#0d111a;color:#e5e9f2}*{box-sizing:border-box}body{margin:0}header{height:54px;background:#151c29;border-bottom:1px solid #30394a;display:flex;align-items:center;gap:10px;padding:0 16px}strong{letter-spacing:.7px}button,input{background:#222d3d;border:1px solid #40506a;border-radius:6px;color:#fff;padding:7px;cursor:pointer}button:hover{background:#314661}button.active{background:#225a53}main{display:grid;grid-template-columns:220px minmax(300px,1fr)260px;height:calc(100vh - 54px)}aside{background:#151c29;padding:14px;border-right:1px solid #30394a;overflow:auto}aside:last-child{border-left:1px solid #30394a;border-right:0}h3{font-size:12px;color:#99aabe;text-transform:uppercase}#viewport{overflow:hidden;background:#101722;position:relative}canvas{width:100%;height:100%;touch-action:none;display:block}#objects button{width:100%;text-align:left;margin-bottom:5px}.selected{outline:1px solid #52c8b0}label{display:block;margin:12px 0 3px;color:#b7c5d8}input{width:100%;cursor:text}#status{margin-left:auto;color:#93a6b9}small{color:#9aacbf}footer{position:absolute;bottom:10px;left:12px;color:#8da0b3;pointer-events:none}@media(max-width:750px){main{grid-template-columns:140px 1fr}aside:last-child{grid-column:1/-1;max-height:220px}main{height:auto}#viewport{height:60vh}header{flex-wrap:wrap;height:auto;padding:8px}}</style></head><body>
<header><strong>WARLIKE ENGINE</strong><small>Editor 2D • 0.1</small><button id="add">+ Objet</button><button id="player">+ Joueur</button><button id="play">▶ Play</button><button id="save">Exporter JSON</button><button id="load">Importer JSON</button><input id="file" type="file" accept=".json" hidden><span id="status">Édition</span></header>
<main><aside><h3>Hierarchy</h3><div id="objects"></div><small>Cliquer un objet pour le sélectionner.</small></aside><section id="viewport"><canvas id="canvas"></canvas><footer>Glisser pour déplacer • flèches / ZQSD en mode Play</footer></section><aside><h3>Inspector</h3><div id="properties"></div></aside></main>
<script type="module">
const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),host=document.querySelector('#viewport'),list=document.querySelector('#objects'),props=document.querySelector('#properties'),status=document.querySelector('#status');let items=[{id:1,name:'Player',type:'player',x:100,y:110,w:38,h:38,color:'#41cdb5'},{id:2,name:'Obstacle',type:'object',x:330,y:180,w:90,h:70,color:'#e2a45f'}],selected=1,drag=null,playing=false,keys=new Set(),original=null,nextId=3;
function active(){return items.find(i=>i.id===selected)}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function refresh(){list.replaceChildren();for(const item of items){const b=document.createElement('button');b.textContent=item.name+'  ['+item.type+']';if(item.id===selected)b.classList.add('selected');b.onclick=()=>{selected=item.id;refresh()};list.append(b)}props.replaceChildren();const obj=active();if(!obj){props.textContent='Aucun objet sélectionné';return}for(const key of ['name','x','y','w','h','color']){const label=document.createElement('label');label.textContent=key.toUpperCase();const inp=document.createElement('input');inp.type=key==='color'?'color':['x','y','w','h'].includes(key)?'number':'text';inp.value=obj[key];inp.oninput=()=>{obj[key]=['x','y','w','h'].includes(key)?Number(inp.value):inp.value;if(key==='name')refresh()};props.append(label,inp)}const del=document.createElement('button');del.textContent='Supprimer';del.onclick=()=>{items=items.filter(i=>i.id!==selected);selected=items[0]?.id??null;refresh()};props.append(del)}refresh();
function size(){const d=devicePixelRatio||1,w=host.clientWidth,h=host.clientHeight;c.width=Math.floor(w*d);c.height=Math.floor(h*d);ctx.setTransform(d,0,0,d,0,0)}new ResizeObserver(size).observe(host);size();
function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.addEventListener('pointerdown',e=>{if(playing)return;const p=point(e);const obj=[...items].reverse().find(o=>p.x>=o.x&&p.y>=o.y&&p.x<=o.x+o.w&&p.y<=o.y+o.h);if(!obj)return;selected=obj.id;drag={id:obj.id,dx:p.x-obj.x,dy:p.y-obj.y};c.setPointerCapture(e.pointerId);refresh()});c.addEventListener('pointermove',e=>{if(!drag||playing)return;const obj=active();if(!obj)return;const p=point(e);obj.x=Math.round(p.x-drag.dx);obj.y=Math.round(p.y-drag.dy)});c.addEventListener('pointerup',()=>{drag=null;refresh()});
document.querySelector('#add').onclick=()=>{const id=nextId++;items.push({id,name:'Object '+id,type:'object',x:130,y:110,w:64,h:64,color:'#8195ef'});selected=id;refresh()};document.querySelector('#player').onclick=()=>{const id=nextId++;items.push({id,name:'Player '+id,type:'player',x:80,y:80,w:38,h:38,color:'#41cdb5'});selected=id;refresh()};
document.querySelector('#play').onclick=()=>{playing=!playing;const btn=document.querySelector('#play');if(playing){original=JSON.stringify(items);btn.textContent='■ Stop';btn.classList.add('active');status.textContent='Play mode'}else{items=JSON.parse(original);btn.textContent='▶ Play';btn.classList.remove('active');status.textContent='Édition';refresh()}};
document.querySelector('#save').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,entities:items},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='warlike-scene.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.querySelector('#load').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async(e)=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.entities))throw Error('Format invalide');items=data.entities.filter(o=>Number.isFinite(o.x)&&Number.isFinite(o.y)&&Number.isFinite(o.w)&&Number.isFinite(o.h)&&typeof o.name==='string'&&typeof o.color==='string').map(o=>({...o,type:o.type==='player'?'player':'object'}));nextId=Math.max(0,...items.map(o=>Number(o.id)||0))+1;selected=items[0]?.id??null;playing=false;document.querySelector('#play').textContent='▶ Play';refresh()}catch(err){alert('Import impossible : '+err.message)}e.target.value=''};
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;keys.add(e.key.toLowerCase());if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));window.addEventListener('blur',()=>keys.clear());
let last=performance.now();function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;const w=host.clientWidth,h=host.clientHeight;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#1e2a3a';ctx.lineWidth=1;for(let x=0;x<w;x+=32){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}for(let y=0;y<h;y+=32){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
if(playing){for(const p of items.filter(i=>i.type==='player')){const x=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('q')||keys.has('a')?1:0),y=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('z')||keys.has('w')?1:0),len=Math.hypot(x,y)||1;for(const axis of ['x','y']){const n=(axis==='x'?x:y)/len*180*dt;const old=p[axis];p[axis]=clamp(old+n,0,Math.max(0,(axis==='x'?w:h)-p[axis==='x'?'w':'h']));if(items.some(o=>o!==p&&o.type!=='player'&&p.x<o.x+o.w&&p.x+p.w>o.x&&p.y<o.y+o.h&&p.y+p.h>o.y))p[axis]=old}}}
for(const o of items){ctx.fillStyle=o.color;ctx.fillRect(o.x,o.y,o.w,o.h);if(!playing&&o.id===selected){ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.strokeRect(o.x-2,o.y-2,o.w+4,o.h+4)}ctx.fillStyle='#dfe8f3';ctx.font='12px system-ui';ctx.fillText(o.name,o.x,o.y-7)}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
