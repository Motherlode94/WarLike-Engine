<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike V2 — Phaser 2D</title>
<style>:root{color-scheme:dark;font:14px system-ui;background:#0f1925;color:#dcebf3}body{margin:0}header{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:#1b3040;border-bottom:1px solid #426072}strong{color:#61ddc3}a{color:#92e7d5}button{padding:9px 12px;border-radius:6px;border:1px solid #649789;background:#21564f;color:#fff;cursor:pointer}#stage{width:min(96vw,1050px);height:min(76vh,740px);margin:25px auto;border:1px solid #426072;border-radius:9px;overflow:hidden}#stage canvas{display:block}#status{margin-left:auto;color:#b4e3d4}p{text-align:center;color:#a7bdcb}</style></head><body>
<header><strong>WARLIKE V2 · PHASER 2D</strong><a href="./v2.html">← Éditeur V2</a><a href="./">WarLike V1</a><button id="export">Exporter la scène JSON</button><span id="status" role="status">Initialisation…</span></header>
<div id="stage"></div><p>Déplace le personnage avec ZQSD, WASD ou les flèches. Les blocs ont une collision 2D.</p>
<script src="https://cdn.jsdelivr.net/npm/phaser@4.2.1/dist/phaser.min.js"></script>
<script type="module">
import {startPhaser2d} from './js/v2/phaser-2d.js';
const status=document.getElementById('status');try{
 const runtime=startPhaser2d(document.getElementById('stage'),{onStatus:text=>status.textContent=text});
 document.getElementById('export').onclick=()=>{
  const blob=new Blob([runtime.serialize()],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');
  link.href=url;link.download='warlike-phaser-2d-scene.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
 };
}catch(error){status.textContent='Erreur Phaser : '+error.message}
</script></body></html>
