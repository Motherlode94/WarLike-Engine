<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike V2 — Three.js 3D</title><style>body{margin:0;background:#202020;color:#e7e7e7;font:14px system-ui}header{display:flex;align-items:center;gap:16px;padding:12px 18px;background:#303030}a{color:#d5d5d5}#stage{height:calc(100dvh - 90px)}#status{margin-left:auto;color:#d0d0d0}footer{padding:8px 18px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script></head><body><header><strong>WARLIKE V2 · THREE.JS 3D</strong><a href="./v2.html">← Éditeur V2</a><a href="./v2-phaser.html">Phaser 2D</a><span id="status" role="status">Chargement Three.js…</span></header><div id="stage"></div><footer>Souris : orbitation • Molette : zoom • Démo WebGL indépendante de la V1</footer><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');
try{
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;stage.append(renderer.domElement);
 const scene=new THREE.Scene();scene.background=new THREE.Color('#34373b');scene.fog=new THREE.FogExp2('#34373b',.011);
 const camera=new THREE.PerspectiveCamera(60,1,.1,160);camera.position.set(10,7,12);
 const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0);
 scene.add(new THREE.HemisphereLight(0xe7efff,0x494440,1.35));
 const fill=new THREE.DirectionalLight(0xc2d8ff,.75);fill.position.set(-7,5,-4);scene.add(fill);
 const sun=new THREE.DirectionalLight(0xffe9ce,2.9);sun.position.set(7,12,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.00015;sun.shadow.normalBias=.025;sun.shadow.radius=2;sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x656461,roughness:.94,metalness:0}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(40,40,0x737373,0x777777);grid.position.y=.008;grid.material.transparent=true;grid.material.opacity=.26;grid.material.depthWrite=false;scene.add(grid);
 for(const [i,x,z,geometry,color,metalness] of [[0,-3,0,new THREE.BoxGeometry(2,2,2),0x50cbaa,.1],[1,1,1,new THREE.SphereGeometry(1,32,24),0xe7a96d,.45],[2,4,-2,new THREE.CylinderGeometry(.8,.8,2,32),0x9aa8df,.65]]){
  const mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color,metalness,roughness:.35}));mesh.position.set(x,1,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
 }
 // The physics world is shared by all editor GameObjects, not a separate demo cube.
 let physicsWorld=null,RAP=null;const bodies=new Map();
 try{
  RAP=await import('https://esm.sh/@dimforge/rapier3d-compat@0.21.0');
  await RAP.init();physicsWorld=new RAP.World({x:0,y:-9.81,z:0});
  const groundBody=physicsWorld.createRigidBody(RAP.RigidBodyDesc.fixed().setTranslation(0,-.1,0));
  physicsWorld.createCollider(RAP.ColliderDesc.cuboid(20,.1,20),groundBody);
  status.textContent='Three.js + Rapier prêts';
 }catch(error){console.warn('Rapier indisponible',error);status.textContent='Three.js actif ; physique indisponible : '+error.message}
 const removeBody=id=>{const entry=bodies.get(id);if(entry&&physicsWorld)physicsWorld.removeRigidBody(entry.body);bodies.delete(id)};
 const editorMeshes=new Map();
 function syncEditorScene(data){
  if(data?.schema!=='warlike.scene.v2'||!Array.isArray(data.objects)||data.objects.length>1000)return;
  const active=new Set();
  for(const object of data.objects){
   const transform=object.components?.find(c=>c.type==='Transform');
   if(typeof object.id!=='string'||!transform||!Array.isArray(transform.position)||!Array.isArray(transform.scale))continue;
   if(![...transform.position,...transform.scale].every(Number.isFinite))continue;
   active.add(object.id);
   let mesh=editorMeshes.get(object.id);
   if(!mesh){
    mesh=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({color:0xbcbcbc,roughness:.48,metalness:.08}));
    mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);editorMeshes.set(object.id,mesh);
   }
   const rendererComp=object.components.find(c=>c.type==='MeshRenderer');
   const shape=['box','sphere','cylinder'].includes(rendererComp?.shape)?rendererComp.shape:'box';
   if(mesh.userData.shape!==shape){mesh.geometry.dispose();mesh.geometry=shape==='sphere'?new THREE.SphereGeometry(.5,24,16):shape==='cylinder'?new THREE.CylinderGeometry(.5,.5,1,24):new THREE.BoxGeometry(1,1,1);mesh.userData.shape=shape}
   mesh.material.color.set(/^#[0-9a-f]{6}$/i.test(rendererComp?.color||'')?rendererComp.color:'#bcbcbc');
   mesh.visible=rendererComp?.visible!==false;
   mesh.material.roughness=Number.isFinite(rendererComp?.roughness)?THREE.MathUtils.clamp(rendererComp.roughness,.04,1):.48;
   mesh.material.metalness=Number.isFinite(rendererComp?.metalness)?THREE.MathUtils.clamp(rendererComp.metalness,0,1):.08;
   mesh.position.fromArray(transform.position);
   mesh.rotation.set(...(Array.isArray(transform.rotation)&&transform.rotation.every(Number.isFinite)?transform.rotation:[0,0,0]));
   mesh.scale.fromArray(transform.scale);
   const body=object.components.find(c=>c.type==='Rigidbody');
   const collider=object.components.find(c=>c.type==='BoxCollider');
   if(physicsWorld&&body&&collider){
    const mode=['dynamic','fixed','kinematic'].includes(body.bodyType)?body.bodyType:'dynamic';
    const size=Array.isArray(collider.size)&&collider.size.length===3&&collider.size.every(n=>Number.isFinite(n)&&n>0)?collider.size:[1,1,1];
    const dims=size.map((n,i)=>Math.max(.01,n*Math.abs(transform.scale[i])));
    const signature=JSON.stringify([mode,dims,collider.isTrigger===true,body.mass]);
    const old=bodies.get(object.id);
    if(!old||old.signature!==signature){
     removeBody(object.id);
     const descriptor=mode==='fixed'?RAP.RigidBodyDesc.fixed():mode==='kinematic'?RAP.RigidBodyDesc.kinematicPositionBased():RAP.RigidBodyDesc.dynamic();
     descriptor.setTranslation(...transform.position);
     const rigid=physicsWorld.createRigidBody(descriptor);
     const colliderDesc=RAP.ColliderDesc.cuboid(...dims.map(v=>v/2)).setSensor(collider.isTrigger===true);
     if(mode==='dynamic')colliderDesc.setMass(Math.max(.001,Number(body.mass)||1));
     physicsWorld.createCollider(colliderDesc,rigid);
     bodies.set(object.id,{body:rigid,signature});
    }else if(mode!=='dynamic'){old.body.setTranslation({x:transform.position[0],y:transform.position[1],z:transform.position[2]},true)}
   }else removeBody(object.id);

  }
  for(const [id,mesh] of editorMeshes)if(!active.has(id)){removeBody(id);scene.remove(mesh);mesh.geometry.dispose();mesh.material.dispose();editorMeshes.delete(id)}
  status.textContent=active.size+' GameObject(s) WarLike V2 synchronisés en 3D';
 }
 window.addEventListener('message',event=>{if(event.origin!==location.origin||event.data?.type!=='warlike:v2:scene')return;syncEditorScene(event.data.scene)});
 if(window.parent!==window)window.parent.postMessage({type:'warlike:v2:ready'},location.origin);
 const resize=()=>{const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};
 new ResizeObserver(resize).observe(stage);resize();
 let running=true,last=performance.now(),accumulator=0;
 function frame(now=performance.now()){
  if(!running)return;
  accumulator+=Math.min(.05,(now-last)/1000);last=now;
  if(physicsWorld){let steps=0;while(accumulator>=1/60&&steps++<4){physicsWorld.timestep=1/60;physicsWorld.step();accumulator-=1/60}
   for(const [id,entry] of bodies){if(!entry.body.isDynamic())continue;const mesh=editorMeshes.get(id);if(!mesh)continue;
    const t=entry.body.translation(),q=entry.body.rotation();mesh.position.set(t.x,t.y,t.z);mesh.quaternion.set(q.x,q.y,q.z,q.w)}
  }
  controls.update();renderer.render(scene,camera);requestAnimationFrame(frame);
 }requestAnimationFrame(frame);
 window.addEventListener('pagehide',()=>{running=false;controls.dispose();renderer.dispose()},{once:true});
 status.textContent='Three.js 3D prêt · matériaux PBR, ombres, caméra orbitale';
}catch(error){status.textContent='Échec de la 3D : '+error.message;console.error(error)}
</script></body></html>
