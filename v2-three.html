<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike V2 — Three.js 3D</title><style>body{margin:0;background:#111b27;color:#e5f5fa;font:14px system-ui}header{display:flex;align-items:center;gap:16px;padding:12px 18px;background:#1c3041}a{color:#8de8cf}#stage{height:calc(100dvh - 90px)}#status{margin-left:auto;color:#a7d9c8}footer{padding:8px 18px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script></head><body><header><strong>WARLIKE V2 · THREE.JS 3D</strong><a href="./v2.html">← Éditeur V2</a><a href="./v2-phaser.html">Phaser 2D</a><span id="status" role="status">Chargement Three.js…</span></header><div id="stage"></div><footer>Souris : orbitation • Molette : zoom • Démo WebGL indépendante de la V1</footer><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const stage=document.getElementById('stage'),status=document.getElementById('status');
try{
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;stage.append(renderer.domElement);
 const scene=new THREE.Scene();scene.background=new THREE.Color('#17283b');scene.fog=new THREE.Fog('#17283b',35,90);
 const camera=new THREE.PerspectiveCamera(60,1,.1,160);camera.position.set(10,8,11);
 const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0);
 scene.add(new THREE.HemisphereLight(0xddeeff,0x6b6357,2));
 const sun=new THREE.DirectionalLight(0xffeed3,3);sun.position.set(7,12,4);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-16;sun.shadow.camera.right=16;sun.shadow.camera.top=16;sun.shadow.camera.bottom=-16;scene.add(sun);
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x354d49,roughness:.9}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);scene.add(new THREE.GridHelper(40,40,0x4f837d,0x37514e));
 for(const [i,x,z,geometry,color,metalness] of [[0,-3,0,new THREE.BoxGeometry(2,2,2),0x50cbaa,.1],[1,1,1,new THREE.SphereGeometry(1,32,24),0xe7a96d,.45],[2,4,-2,new THREE.CylinderGeometry(.8,.8,2,32),0x9aa8df,.65]]){
  const mesh=new THREE.Mesh(geometry,new THREE.MeshStandardMaterial({color,metalness,roughness:.35}));mesh.position.set(x,1,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);
 }
 // Rapier physics is optional; a missing WASM bundle must not break Three.js rendering.
 let physicsWorld=null,physicsBody=null,falling=null;
 try{
  const RAP=await import('https://esm.sh/@dimforge/rapier3d-compat@0.21.0');
  await RAP.init();
  physicsWorld=new RAP.World({x:0,y:-9.81,z:0});
  const floor=physicsWorld.createRigidBody(RAP.RigidBodyDesc.fixed().setTranslation(0,-.1,0));
  physicsWorld.createCollider(RAP.ColliderDesc.cuboid(20,.1,20),floor);
  physicsBody=physicsWorld.createRigidBody(RAP.RigidBodyDesc.dynamic().setTranslation(0,6,0));
  physicsWorld.createCollider(RAP.ColliderDesc.cuboid(.45,.45,.45).setRestitution(.35),physicsBody);
  falling=new THREE.Mesh(new THREE.BoxGeometry(.9,.9,.9),new THREE.MeshStandardMaterial({color:0xed7777,metalness:.18,roughness:.32}));
  falling.castShadow=true;scene.add(falling);
  status.textContent='Three.js + Rapier prêts · chute physique active';
 }catch(error){console.warn('Rapier 3D unavailable',error);status.textContent='Three.js prêt · Rapier indisponible : '+error.message}
 const resize=()=>{const w=Math.max(1,stage.clientWidth),h=Math.max(1,stage.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};
 new ResizeObserver(resize).observe(stage);resize();
 let running=true;function frame(){if(!running)return;if(physicsWorld){physicsWorld.step();const t=physicsBody.translation(),r=physicsBody.rotation();falling.position.set(t.x,t.y,t.z);falling.quaternion.set(r.x,r.y,r.z,r.w)}controls.update();renderer.render(scene,camera);requestAnimationFrame(frame)}frame();
 window.addEventListener('pagehide',()=>{running=false;controls.dispose();renderer.dispose()},{once:true});
 status.textContent='Three.js 3D prêt · matériaux PBR, ombres, caméra orbitale';
}catch(error){status.textContent='Échec de la 3D : '+error.message;console.error(error)}
</script></body></html>
