<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike Engine V2 — Scene Editor</title>
<style>
:root{font:14px system-ui;background:#101823;color:#dfebf5;color-scheme:dark;--accent:#54d6bb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;background:#263646;border:1px solid #405567;color:inherit;border-radius:5px;padding:7px 10px}button:hover{border-color:var(--accent)}header{height:58px;display:flex;align-items:center;gap:10px;padding:9px 14px;background:#182837;border-bottom:1px solid #375063}header strong{color:var(--accent)}.layout{height:calc(100dvh - 90px);display:grid;grid-template-columns:minmax(185px,23%) minmax(340px,1fr) minmax(240px,26%)}aside,main{min-height:0;border-right:1px solid #344b5b}aside{overflow:auto;background:#162331;padding:12px}h2{font-size:13px;letter-spacing:.05em;color:#a3c9d8;margin:0 0 12px}#hierarchy{display:grid;gap:5px}#hierarchy button{text-align:left}.selected{border-color:var(--accent);background:#234f50}main{display:flex;flex-direction:column;position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#inspector{display:grid;gap:12px}label{display:grid;gap:5px;color:#a9c6d3}input{background:#101c29;border:1px solid #496073;border-radius:4px;padding:6px;color:#edf7ff;width:100%}.triplet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}footer{height:32px;padding:7px 14px;background:#172837;color:#b9d3de;border-top:1px solid #375063}#status{margin-left:auto;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#aad2bd}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}a{color:#9feddc}small{color:#9cb8c6}.hint{padding:9px 12px;background:#192b37;border-bottom:1px solid #344b5b}#viewport{flex:1;min-height:0}@media(max-width:750px){.layout{grid-template-columns:145px minmax(200px,1fr)}.layout aside:last-child{grid-column:1/-1;max-height:220px}header{height:auto;min-height:58px;flex-wrap:wrap}.layout{height:calc(100dvh - 125px)}} </style></head><body>
