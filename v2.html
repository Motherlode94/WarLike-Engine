<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarLike Engine V2 — Scene Editor</title>
<style>
:root{font:14px system-ui;background:#101823;color:#dfebf5;color-scheme:dark;--accent:#54d6bb}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer;background:#263646;border:1px solid #405567;color:inherit;border-radius:5px;padding:7px 10px}button:hover{border-color:var(--accent)}header{height:58px;display:flex;align-items:center;gap:10px;padding:9px 14px;background:#182837;border-bottom:1px solid #375063}header strong{color:var(--accent)}.layout{height:calc(100dvh - 90px);display:grid;grid-template-columns:minmax(185px,23%) minmax(340px,1fr) minmax(240px,26%)}aside,main{min-height:0;border-right:1px solid #344b5b}aside{overflow:auto;background:#162331;padding:12px}h2{font-size:13px;letter-spacing:.05em;color:#a3c9d8;margin:0 0 12px}#hierarchy{display:grid;gap:5px}#hierarchy button{text-align:left}.selected{border-color:var(--accent);background:#234f50}main{display:flex;flex-direction:column;position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#inspector{display:grid;gap:12px}label{display:grid;gap:5px;color:#a9c6d3}input{background:#101c29;border:1px solid #496073;border-radius:4px;padding:6px;color:#edf7ff;width:100%}.triplet{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}footer{height:32px;padding:7px 14px;background:#172837;color:#b9d3de;border-top:1px solid #375063}#status{margin-left:auto;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#aad2bd}.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}a{color:#9feddc}small{color:#9cb8c6}.hint{padding:9px 12px;background:#192b37;border-bottom:1px solid #344b5b}#viewport{flex:1;min-height:0}@media(max-width:750px){.layout{grid-template-columns:145px minmax(200px,1fr)}.layout aside:last-child{grid-column:1/-1;max-height:220px}header{height:auto;min-height:58px;flex-wrap:wrap}.layout{height:calc(100dvh - 125px)}}  canvas[hidden]{display:none!important}.runtime-panel{flex:1;min-height:0;display:flex;flex-direction:column}.runtime-panel[hidden]{display:none}.runtime-panel iframe{width:100%;height:100%;border:0;background:#142434}.mode-active{border-color:var(--accent);color:#c8fff4}.runtime-toggle{display:flex;gap:6px;padding:6px 10px;background:#152637;border-bottom:1px solid #344b5b}</style></head><body>
<header><strong>◈ WARLIKE V2</strong><a href="./">← V1</a><a href="./v2-phaser.html">▶ Phaser 2D</a><button type="button" id="modeScene" class="mode-active">Édition</button><button type="button" id="mode2d">▶ Phaser 2D</button><button type="button" id="mode3d">▶ Three.js + Rapier 3D</button><span class="tools"><button id="add">＋ GameObject</button><button id="duplicate">Dupliquer</button><button id="remove">Supprimer</button><button id="undo">↶</button><button id="redo">↷</button><button id="save">↓ JSON</button><button id="load">↑ JSON</button><input type="file" id="file" accept=".json,application/json" hidden></span><small id="status" role="status">Scene Editor V2</small></header>
<div class="layout"><aside><h2>HIERARCHY</h2><div id="hierarchy"></div></aside><main><div class="hint">SCENE · Vue 3D filaire · Clique un objet pour le sélectionner · Glisse pour le déplacer sur X/Z</div><canvas id="viewport" aria-label="Vue isométrique de la scène"></canvas><div class="runtime-panel" id="runtimePanel" hidden><div class="runtime-toggle"><span id="runtimeLabel">Runtime</span><button type="button" id="reloadRuntime">↻ Redémarrer</button></div><iframe id="runtimeFrame" title="Moteur de jeu WarLike" loading="lazy"></iframe></div></main><aside><h2>INSPECTOR</h2><div id="inspector"><p>Sélectionne un GameObject.</p></div></aside></div><footer>WarLike Core V2 · Scènes, composants, historique et sauvegarde indépendants</footer>
<script type="module" src="./js/v2/editor.js"></script>
<script type="module">
const panel=document.getElementById('runtimePanel'),frame=document.getElementById('runtimeFrame'),canvas=document.getElementById('viewport');
const modes={modeScene:null,mode2d:'./v2-phaser.html',mode3d:'./v2-three.html'};let current='modeScene';
let currentScene=null;
const sendScene=()=>{if(currentScene&&frame.contentWindow&&current!=='modeScene')frame.contentWindow.postMessage({type:'warlike:v2:scene',scene:currentScene},location.origin)};
window.addEventListener('warlike:v2-scene',event=>{currentScene=event.detail;sendScene()});
frame.addEventListener('load',sendScene);
window.addEventListener('message',event=>{if(event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.type==='warlike:v2:ready')sendScene()});

function switchMode(mode){current=mode;const url=modes[mode];panel.hidden=!url;canvas.hidden=!!url;
 if(url&&frame.getAttribute('src')!==url)frame.src=url;
 if(url)window.dispatchEvent(new Event('warlike:v2-request-scene'));
 for(const key of Object.keys(modes))document.getElementById(key).classList.toggle('mode-active',key===mode);
 document.getElementById('runtimeLabel').textContent=mode==='mode2d'?'Phaser · 2D':'Three.js + Rapier · 3D';
 if(!url){frame.removeAttribute('src');window.dispatchEvent(new Event('resize'))}
}
for(const mode of Object.keys(modes))document.getElementById(mode).onclick=()=>switchMode(mode);
document.getElementById('reloadRuntime').onclick=()=>{if(modes[current])frame.src=modes[current]};
</script></body></html>
